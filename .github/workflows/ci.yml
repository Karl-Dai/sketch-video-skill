name: Render and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk
          python -m pip install -r requirements-dev.txt -r requirements-voice-tools.txt
      - name: Validate package and regression tests
        env:
          TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        run: |
          python scripts/check_package.py
          python -m unittest discover -s tests -v
      - name: Test CLI, npm whitelist and extracted tarball end to end
        env:
          TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          TEST_PRODUCTION: '1'
          GITHUB_NPX_SPEC: git+https://github.com/Karl-Dai/sketch-video-skill.git#35c4e203f72cbdcdd0de29fdf7f9c9b20a8f79b9
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          TEST_PYTHON="$(command -v python)" npm run test:pack
          TEST_PYTHON="$(command -v python)" npm run test:github
      - name: Render and fully decode English, Chinese and HD examples
        run: |
          python scripts/render.py examples/idea-to-video.json --out build/demo --size 360x640 --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python scripts/verify.py build/demo
          python scripts/render.py examples/water-cycle.zh.json --out build/water --size 360x640 --font /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          python scripts/verify.py build/water
          python scripts/render.py examples/smoke-hd.json --out build/hd --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python scripts/verify.py build/hd
          python scripts/render.py examples/mixed-visuals.json --out build/mixed --size 360x640 --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python scripts/verify.py build/mixed
  node-22:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:pack
